name: StudyOne
options:
  bundleIdPrefix: com.studyone
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
targets:
  StudyOne:
    type: application
    platform: iOS
    sources:
      - path: StudyOne
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studyone.ios
        PRODUCT_NAME: StudyOne
        MARKETING_VERSION: 3.0.0
        CURRENT_PROJECT_VERSION: 30000
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StudyOne
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []

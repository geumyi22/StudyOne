name: StudyOne Beta Release
on:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify tested head and version
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$HEAD_SHA" != "$TESTED_SHA" ]]; then
            echo "Stale build skipped"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(python3 -c 'import json; print("v"+json.load(open("version.json"))["versionName"])')
          if [[ "$TAG" != "v2.7.0-beta.1" ]]; then
            echo "Not the approved beta release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Download validated APK
        if: steps.identity.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name StudyOne-v2-debug-apk --dir dist
          mv dist/app-debug.apk dist/StudyOne-v2.7.0-beta.1.apk
          sha256sum dist/StudyOne-v2.7.0-beta.1.apk > dist/StudyOne-v2.7.0-beta.1.sha256
          unzip -t dist/StudyOne-v2.7.0-beta.1.apk >/dev/null
      - name: Publish prerelease
        if: steps.identity.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; will not overwrite"
            exit 0
          fi
          gh release create "$TAG" dist/StudyOne-v2.7.0-beta.1.apk dist/StudyOne-v2.7.0-beta.1.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$TESTED_SHA" \
            --title "StudyOne v2.7.0 Beta 1" --notes-file docs/RELEASE-2.7.0-BETA.md --prerelease

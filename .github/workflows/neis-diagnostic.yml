name: NEIS Connectivity Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neis-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare NEIS schoolInfo HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          URL='https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=1&pSize=100&SCHUL_NM=%EC%84%9C%EC%9E%AC%EC%A4%91'
          for MODE in default app-header browser-header; do
            echo "=== ${MODE} ==="
            case "${MODE}" in
              app-header)
                EXTRA=(-A 'StudyOne/2.0.1 Android' -H 'Accept: application/json')
                ;;
              browser-header)
                EXTRA=(-A 'Mozilla/5.0 (Linux; Android 17) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36' -H 'Accept: application/json')
                ;;
              *)
                EXTRA=()
                ;;
            esac
            STATUS=$(curl -sS -m 15 --retry 0 -o /tmp/neis-body -w '%{http_code}' "${EXTRA[@]}" "${URL}" || true)
            echo "HTTP_STATUS=${STATUS}"
            head -c 320 /tmp/neis-body || true
            echo
          done

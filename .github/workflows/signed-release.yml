name: Signed In-App Update Release

on:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE to sign and publish this exact main commit"
        required: true
        type: string

permissions:
  contents: write

jobs:
  signed-release:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'RELEASE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v5

      - name: Verify tested commit is current main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$HEAD_SHA" = "$TESTED_SHA" || { echo "Stale candidate; abort release"; exit 1; }
          grep -q '"versionName": "3.0.0-beta.1"' version.json

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android CLI
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROIDCLI="$ANDROID_HOME/cmdline-tools/15859902/bin/android"
          "$ANDROIDCLI" --sdk="$ANDROID_HOME" sdk install --canary \
            platforms/android-37 build-tools/37.0.0 platform-tools

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Load protected signing keystore
        env:
          ENCODED_KEY: ${{ secrets.STUDYONE_KEYSTORE_BASE64 }}
          STUDYONE_STORE_PASSWORD: ${{ secrets.STUDYONE_STORE_PASSWORD }}
          STUDYONE_KEY_PASSWORD: ${{ secrets.STUDYONE_KEY_PASSWORD }}
          STUDYONE_KEY_ALIAS: ${{ secrets.STUDYONE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for FIELD in ENCODED_KEY STUDYONE_STORE_PASSWORD STUDYONE_KEY_PASSWORD STUDYONE_KEY_ALIAS; do
            if [ -z "${!FIELD}" ]; then
              echo "Missing required GitHub Actions Secret: $FIELD"
              exit 1
            fi
          done
          KEYFILE="$RUNNER_TEMP/studyone-release.jks"
          printf '%s' "$ENCODED_KEY" | base64 --decode > "$KEYFILE"
          chmod 600 "$KEYFILE"
          echo "STUDYONE_KEYSTORE_FILE=$KEYFILE" >> "$GITHUB_ENV"
          echo "STUDYONE_STORE_PASSWORD=$STUDYONE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "STUDYONE_KEY_PASSWORD=$STUDYONE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "STUDYONE_KEY_ALIAS=$STUDYONE_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Compile verified release APK
        run: |
          gradle :app:assembleRelease :app:lintRelease --stacktrace --no-daemon

      - name: Strict signature and manifest verification
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BT="$ANDROID_HOME/build-tools/37.0.0"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$BT/zipalign" -c -P 16 -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          grep -E 'Verified using v[23] scheme.*true' "$RUNNER_TEMP/apk-signature.txt"
          PIN="3f95e9aaecb32ae66c86dbd6795b0a49118f8dacf515f7fbe31795970b1681ed"
          grep -qi "$PIN" "$RUNNER_TEMP/apk-signature.txt" || {
            echo 'Release signing certificate does not match trusted StudyOne key.'
            exit 1
          }
          "$BT/aapt2" dump badging "$APK" | grep "package: name='com.studyone.app'" | grep "versionCode='30000'"
          echo "Release signature fingerprint verified (SHA-256)"
          sha256sum "$APK"

      - name: Download v2.8 signed APK for upgrade test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download v2.8.0-beta.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'StudyOne-v2.8.0-beta.1.apk' --dir previous
          test -s previous/StudyOne-v2.8.0-beta.1.apk

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Emulator installation and six-tab UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: UPGRADE_BASE_APK=previous/StudyOne-v2.8.0-beta.1.apk bash scripts/emulator-smoke.sh app/build/outputs/apk/release/app-release.apk

      - name: Prepare release and updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(python3 -c 'import json; print("v"+json.load(open("version.json"))["versionName"])')
          test "$TAG" = "v3.0.0-beta.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: refuse to overwrite a published version"
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/StudyOne-v3.0.0-beta.1.apk"
          (cd dist && sha256sum StudyOne-v3.0.0-beta.1.apk > StudyOne-v3.0.0-beta.1.sha256)
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          version=json.loads(Path("version.json").read_text())
          apk=Path("dist/StudyOne-v3.0.0-beta.1.apk")
          meta={
            "versionCode":version["versionCode"],
            "versionName":version["versionName"],
            "apkUrl":"https://github.com/geumyi22/StudyOne/releases/download/v3.0.0-beta.1/StudyOne-v3.0.0-beta.1.apk",
            "sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
            "notes":"AI 학습 도우미: 설명·퀴즈·맞춤 계획, 동일 서명 업데이트 지원"
          }
          Path("dist/studyone-update.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Publish opt-in beta with stable signing certificate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v3.0.0-beta.1" \
            dist/StudyOne-v3.0.0-beta.1.apk \
            dist/StudyOne-v3.0.0-beta.1.sha256 \
            dist/studyone-update.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "StudyOne V3 Beta 1 - AI Study Assistant" \
            --notes-file docs/RELEASE-3.0.0-BETA.md --prerelease

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/studyone-release.jks"

name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android 17 SDK
        shell: bash
        run: |
          ANDROIDCLI="$ANDROID_HOME/cmdline-tools/15859902/bin/android"
          test -x "$ANDROIDCLI"
          "$ANDROIDCLI" --version
          "$ANDROIDCLI" --sdk="$ANDROID_HOME" sdk install --canary             platforms/android-37             build-tools/37.0.0             platform-tools
          "$ANDROIDCLI" --sdk="$ANDROID_HOME" sdk list --all --canary | grep -E "platforms/android-37|build-tools/37" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/37.0.0"
          test -f "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null
          "$BT/zipalign" -c -P 16 -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOne-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke:
    name: emulator-smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v5
        with:
          name: StudyOne-v2-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            APK="apk/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.studyone.app/.MainActivity
            sleep 4
            PID="$(adb shell pidof com.studyone.app | tr -d '\r')"
            echo "StudyOne PID=$PID"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -q "com.studyone.app/.MainActivity"
            if adb logcat -d -b crash | grep -q "com.studyone.app"; then
              echo "StudyOne crash detected"
              adb logcat -d -b crash
              exit 1
            fi
            echo "StudyOne emulator smoke test passed"

name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android 17 SDK
        shell: bash
        run: |
          ANDROIDCLI="$ANDROID_HOME/cmdline-tools/15859902/bin/android"
          test -x "$ANDROIDCLI"
          "$ANDROIDCLI" --version
          "$ANDROIDCLI" --sdk="$ANDROID_HOME" sdk install --canary             platforms/android-37             build-tools/37.0.0             platform-tools
          "$ANDROIDCLI" --sdk="$ANDROID_HOME" sdk list --all --canary | grep -E "platforms/android-37|build-tools/37" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/37.0.0"
          test -f "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null
          "$BT/zipalign" -c -P 16 -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOne-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: StudyOne Account TLS Backend Canary
on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/private-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend modules
        run: python -m compileall -q server
      - name: Auth, tenant isolation, revocation and SQL transaction suite
        run: python -m unittest discover -s server/tests -p 'test_*.py' -v

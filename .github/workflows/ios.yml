name: StudyOne iOS unsigned IPA

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'version.json'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      attach_to_matching_release:
        description: "Explicitly attach the existing unsigned iOS artifact to a matching signed release (only when already published)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: studyone-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show macOS and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          xcodegen --version

      - name: Build unsigned iOS IPA
        run: bash ios/scripts/build_unsigned_ipa.sh

      - name: Compile DEBUG simulator-only sync experiment on PR
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          xcodebuild -project StudyOne.xcodeproj -scheme StudyOne \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Run real iOS Simulator app-to-server network E2E
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: bash ios/scripts/run_simulator_sync_e2e.sh

      - name: Upload IPA and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: StudyOne-iOS-unsigned
          path: |
            ios/dist/*.ipa
            ios/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Verify IPA matches source version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("ios/version.json"))["versionName"])')"
          ( cd ios/dist && /usr/bin/shasum -a 256 -c "StudyOne-v${VERSION}-unsigned.ipa.sha256" )
          test -s "ios/dist/StudyOne-v${VERSION}-unsigned.ipa"
          unzip -t "ios/dist/StudyOne-v${VERSION}-unsigned.ipa" >/dev/null

      - name: Attach verified unsigned IPA to matching Android prerelease
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_to_matching_release == true && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("ios/version.json"))["versionName"])')"
          TAG="v${VERSION}"
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$HEAD" != "$GITHUB_SHA" ]]; then
            echo "Main advanced: refuse stale artifact attachment"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No existing matching iOS version release: $TAG; no publication attempted"
            exit 1
          fi
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$GITHUB_SHA" || { echo "Version tag does not match tested commit"; exit 1; }
          gh release upload "$TAG" "ios/dist/StudyOne-v${VERSION}-unsigned.ipa" "ios/dist/StudyOne-v${VERSION}-unsigned.ipa.sha256" --repo "$GITHUB_REPOSITORY"
          echo "Uploaded opt-in unsigned IPA to existing release $TAG"


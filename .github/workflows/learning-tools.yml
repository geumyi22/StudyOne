name: StudyOne Learning Tools Contract
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/studyone/app/StudyPaperSchedule.java'
      - 'ios/StudyOne/StudyPaperSchedule.swift'
      - 'windows/**'
      - 'server/studyone_study_schedule.py'
      - 'scripts/tests/check_schedule_runtime.py'
      - 'scripts/tests/schedule_cases.py'
      - 'scripts/tests/swift_schedule/**'
      - '.github/workflows/learning-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-parity:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute 114 pinned synthetic fixtures per Python, Java and Swift engine
        run: python3 scripts/tests/check_schedule_runtime.py
